<!doctype html>
<!--
  Screen ID: S-F04-01
  Screen name: Staff page
  Vietnamese title: Trang nhân viên
  Frame: staff (1280px, export 1x)
  ui-conventions version: v0.9
  Author / date: Ha (wireframe) · HTML redraw from the Draw.io source 23/11/2026 (Chi)

  «Đăng xuất» (#7) is in the header of every state (D7). No Primary button on this page (ui-conventions section 3).
  States: #default #loading #error (MSG-04).
  Numbers: #1-#7 = notes/s_f04_01_notes.md.
  Add "-numbered" to a state (e.g. #error-numbered) to show the element numbers.
  Colours, sizes and fonts come only from ui_tokens.css.
-->
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>S-F04-01 · Trang nhân viên</title>
  <link rel="stylesheet" href="ui_tokens.css">
  <style>
    /* numbered images only: where the element-number circles sit */
    .num.after { top: 50%; left: calc(100% + var(--space-1)); transform: translateY(-50%); }
    .num.before { top: 50%; left: auto; right: calc(100% + var(--space-1)); transform: translateY(-50%); }
    .title-wrap { display: inline-flex; min-width: 0; }
    .modal .modal-title > .num, .modal .modal-body > .num { top: 0; left: calc(var(--space-6) * -1); }

    .screen-header .header-signout { margin-left: auto; }
    .tile-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-6); }
    .tile-text { display: flex; flex-direction: column; gap: var(--space-1); }
    .tile-skeleton { display: flex; gap: var(--space-4); align-items: flex-start; padding: var(--space-6); }
    .tile-skeleton .group { flex: 1; }
    .tile-skeleton .skeleton.block { width: var(--size-icon); height: var(--size-icon); }
    .banner-body .secondary-button { width: auto; }
  </style>
</head>
<body data-frame="staff">
  <div class="frame">

    <!-- ===================== DEFAULT ===================== -->
    <section data-state="default">
      <header class="screen-header"><span class="title-wrap has-num"><h1 class="screen-title">Trang nhân viên</h1><span class="num after">1</span></span><button class="secondary-button has-num header-signout" type="button"><span class="num">7</span>Đăng xuất</button></header>
      <main class="screen-body"><div class="tile-grid">
        <a class="menu-tile has-num" href="s_f02_03.html"><span class="num">2</span><svg class="icon" viewBox="0 0 24 24"><path d="M7 9V3h10v6M7 17H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2M7 14h10v7H7z"/></svg><span class="tile-text"><span class="tile-title">In nhãn mã QR</span><span>Chọn sách bản giấy để in nhãn.</span></span></a>
        <a class="menu-tile has-num" href="s_f02_04.html"><span class="num">3</span><svg class="icon" viewBox="0 0 24 24"><path d="M5 21V4M5 4h12l-2 4 2 4H5"/></svg><span class="tile-text"><span class="tile-title">Đánh giá bị báo cáo</span><span>Xem và xử lý các đánh giá bị báo cáo.</span></span></a>
      </div></main>
    </section>

    <!-- ===================== LOADING (MSG-05: skeleton, no text) ===================== -->
    <section data-state="loading">
      <header class="screen-header"><span class="title-wrap has-num"><h1 class="screen-title">Trang nhân viên</h1><span class="num after">1</span></span><button class="secondary-button has-num header-signout" type="button"><span class="num">7</span>Đăng xuất</button></header>
      <main class="screen-body" aria-busy="true"><div class="tile-grid">
        <div class="card tile-skeleton has-num"><span class="num">4</span><div class="skeleton block"></div><div class="group"><div class="skeleton line"></div><div class="skeleton line short"></div></div></div>
        <div class="card tile-skeleton has-num"><div class="skeleton block"></div><div class="group"><div class="skeleton line"></div><div class="skeleton line short"></div></div></div>
      </div></main>
    </section>

    <!-- ===================== ERROR: network failure (MSG-04) ===================== -->
    <section data-state="error">
      <header class="screen-header"><span class="title-wrap has-num"><h1 class="screen-title">Trang nhân viên</h1><span class="num after">1</span></span><button class="secondary-button has-num header-signout" type="button"><span class="num">7</span>Đăng xuất</button></header>
      <main class="screen-body">
        <div class="banner error has-num" role="alert"><span class="num">5</span><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></svg><div class="banner-body"><span>Không tải được trang. Bạn kiểm tra kết nối mạng rồi thử lại.</span><button class="secondary-button has-num" type="button"><span class="num">6</span>Thử lại</button></div></div>
      </main>
    </section>

  </div>

  <script>
    // Show the section named after "#", e.g. #error. "-numbered" at the end turns on the circles.
    (function () {
      function apply() {
        var hash = decodeURIComponent(location.hash.replace(/^#/, ''));
        var numbered = /-numbered$/.test(hash);
        var state = hash.replace(/-numbered$/, '') || 'default';
        var sections = document.querySelectorAll('[data-state]');
        var found = false;
        sections.forEach(function (s) { if (s.getAttribute('data-state') === state) found = true; });
        if (!found) state = 'default';
        sections.forEach(function (s) {
          s.classList.toggle('is-active', s.getAttribute('data-state') === state);
        });
        document.body.classList.toggle('numbered', numbered);
      }
      window.addEventListener('hashchange', apply);
      apply();
    })();
  </script>
</body>
</html>
