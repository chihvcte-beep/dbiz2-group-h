<!doctype html>
<!--
  Screen ID: S-F00-01
  Screen name: Sign in: library card number
  Vietnamese title: Đăng nhập
  Frame: reader (360px, export 3x = 1080px)
  ui-conventions version: v0.9
  Author / date: Ha (wireframe) · HTML redraw from the Draw.io source 23/11/2026 (Chi)

  No Back button: «Huỷ» returns to the starting screen and the pending action is kept (D1).
  States: #default #loading #error #error-2 (card format) #error-3 (network, MSG-04).
  Numbers: #1-#8 = notes/s_f00_01_notes.md.
  Add "-numbered" to a state (e.g. #error-numbered) to show the element numbers.
  Colours, sizes and fonts come only from ui_tokens.css.
-->
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>S-F00-01 · Đăng nhập</title>
  <link rel="stylesheet" href="ui_tokens.css">
  <style>
    /* numbered images only: where the element-number circles sit */
    .num.after { top: 50%; left: calc(100% + var(--space-1)); transform: translateY(-50%); }
    .num.before { top: 50%; left: auto; right: calc(100% + var(--space-1)); transform: translateY(-50%); }
    .title-wrap { display: inline-flex; min-width: 0; }
    .modal .modal-title > .num, .modal .modal-body > .num { top: 0; left: calc(var(--space-6) * -1); }

    .reader-form { display: flex; flex-direction: column; gap: var(--space-4); }
    .form-actions { display: flex; flex-direction: column; gap: var(--space-2); }
    .form-actions .primary-button, .form-actions .secondary-button { width: 100%; }
    .banner-body .secondary-button { width: auto; }
    .field > .num { left: auto; right: calc(var(--space-2) * -1); }
  </style>
</head>
<body data-frame="reader">
  <div class="frame">

    <!-- ===================== DEFAULT ===================== -->
    <section data-state="default">
      <header class="screen-header"><span class="title-wrap has-num"><h1 class="screen-title">Đăng nhập</h1><span class="num after">1</span></span></header>
      <main class="screen-body">
        <form class="reader-form" onsubmit="return false">
          
          <div class="field has-num"><span class="num">2</span>
            <label class="field-label" for="default-card">Số thẻ thư viện</label>
            <input class="text-input" id="default-card" type="text" inputmode="numeric" maxlength="7">
            
          </div>
          
          <div class="form-actions">
            <button class="primary-button has-num" type="button"><span class="num">3</span>Gửi mã</button>
            <button class="secondary-button has-num" type="button"><span class="num">4</span>Huỷ</button>
          </div>
        </form>
      </main>
    </section>

    <!-- ===================== LOADING (MSG-05: skeleton, no text) ===================== -->
    <section data-state="loading">
      <header class="screen-header"><span class="title-wrap has-num"><h1 class="screen-title">Đăng nhập</h1><span class="num after">1</span></span></header>
      <main class="screen-body">
        <form class="reader-form" onsubmit="return false" aria-busy="true">
          
          <div class="field has-num"><span class="num">2</span>
            <label class="field-label" for="loading-card">Số thẻ thư viện</label>
            <input class="text-input" id="loading-card" type="text" inputmode="numeric" maxlength="7" value="0012345" disabled>
            
          </div>
          <div class="group has-num"><span class="num">7</span><div class="skeleton line"></div><div class="skeleton line short"></div></div>
          <div class="form-actions">
            <button class="primary-button has-num is-disabled" type="button" disabled><span class="num">3</span>Gửi mã</button>
            <button class="secondary-button has-num" type="button"><span class="num">4</span>Huỷ</button>
          </div>
        </form>
      </main>
    </section>

    <!-- ===================== ERROR: any card rejection ===================== -->
    <section data-state="error">
      <header class="screen-header"><span class="title-wrap has-num"><h1 class="screen-title">Đăng nhập</h1><span class="num after">1</span></span></header>
      <main class="screen-body">
        <form class="reader-form" onsubmit="return false">
          <div class="banner error has-num" role="alert"><span class="num">6</span><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></svg><div class="banner-body"><span>Không thể đăng nhập. Bạn kiểm tra thông tin rồi thử lại.</span></div></div>
          <div class="field has-num"><span class="num">2</span>
            <label class="field-label" for="error-card">Số thẻ thư viện</label>
            <input class="text-input" id="error-card" type="text" inputmode="numeric" maxlength="7" value="9999999">
            
          </div>
          
          <div class="form-actions">
            <button class="primary-button has-num" type="button"><span class="num">3</span>Gửi mã</button>
            <button class="secondary-button has-num" type="button"><span class="num">4</span>Huỷ</button>
          </div>
        </form>
      </main>
    </section>

    <!-- ===================== ERROR 2: card format ===================== -->
    <section data-state="error-2">
      <header class="screen-header"><span class="title-wrap has-num"><h1 class="screen-title">Đăng nhập</h1><span class="num after">1</span></span></header>
      <main class="screen-body">
        <form class="reader-form" onsubmit="return false">
          
          <div class="field is-error has-num"><span class="num">2</span>
            <label class="field-label" for="error-2-card">Số thẻ thư viện</label>
            <input class="text-input" id="error-2-card" type="text" inputmode="numeric" maxlength="7" value="12345">
            <div class="inline-error has-num" role="alert"><span class="num">5</span><span class="bang" aria-hidden="true">!</span><span>Số thẻ thư viện gồm 7 chữ số. Bạn kiểm tra lại nhé.</span></div>
          </div>
          
          <div class="form-actions">
            <button class="primary-button has-num" type="button"><span class="num">3</span>Gửi mã</button>
            <button class="secondary-button has-num" type="button"><span class="num">4</span>Huỷ</button>
          </div>
        </form>
      </main>
    </section>

    <!-- ===================== ERROR 3: network failure (MSG-04), card number kept ===================== -->
    <section data-state="error-3">
      <header class="screen-header"><span class="title-wrap has-num"><h1 class="screen-title">Đăng nhập</h1><span class="num after">1</span></span></header>
      <main class="screen-body">
        <form class="reader-form" onsubmit="return false">
          <div class="banner error has-num" role="alert"><span class="num">6</span><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></svg><div class="banner-body"><span>Không tải được trang. Bạn kiểm tra kết nối mạng rồi thử lại.</span><button class="secondary-button has-num" type="button"><span class="num">8</span>Thử lại</button></div></div>
          <div class="field has-num"><span class="num">2</span>
            <label class="field-label" for="error-3-card">Số thẻ thư viện</label>
            <input class="text-input" id="error-3-card" type="text" inputmode="numeric" maxlength="7" value="0012345">
            
          </div>
          
          <div class="form-actions">
            <button class="primary-button has-num" type="button"><span class="num">3</span>Gửi mã</button>
            <button class="secondary-button has-num" type="button"><span class="num">4</span>Huỷ</button>
          </div>
        </form>
      </main>
    </section>

  </div>

  <script>
    // Show the section named after "#", e.g. #error. "-numbered" at the end turns on the circles.
    (function () {
      function apply() {
        var hash = decodeURIComponent(location.hash.replace(/^#/, ''));
        var numbered = /-numbered$/.test(hash);
        var state = hash.replace(/-numbered$/, '') || 'default';
        var sections = document.querySelectorAll('[data-state]');
        var found = false;
        sections.forEach(function (s) { if (s.getAttribute('data-state') === state) found = true; });
        if (!found) state = 'default';
        sections.forEach(function (s) {
          s.classList.toggle('is-active', s.getAttribute('data-state') === state);
        });
        document.body.classList.toggle('numbered', numbered);
      }
      window.addEventListener('hashchange', apply);
      apply();
    })();
  </script>
</body>
</html>
